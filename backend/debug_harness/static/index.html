<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matching Engine — DEBUG HARNESS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.4 system-ui, sans-serif;
      background: #0b0e14; color: #d6deeb;
    }
    .banner {
      background: repeating-linear-gradient(45deg, #3a2a00, #3a2a00 12px, #2c2000 12px, #2c2000 24px);
      color: #ffcc66; padding: 8px 16px; font-weight: 600; letter-spacing: .3px;
      border-bottom: 1px solid #665500;
    }
    .wrap { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 12px; }
    .stage { position: relative; width: 640px; max-width: 100%; }
    video { display: none; }
    canvas { width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); }
    .overlay {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: none; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 18px; border-radius: 12px; font-weight: 700; font-size: 20px;
      color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.55); pointer-events: none;
      text-align: center; white-space: nowrap;
    }
    .overlay.show { display: flex; }
    .overlay.match { background: #1a7f37; }
    .overlay.nomatch { background: #b62324; }
    .overlay.wait { background: #3a4252; }
    .overlay .sub { font-weight: 500; font-size: 13px; opacity: .9; }
    .panel { background: #121722; border: 1px solid #222b3a; border-radius: 8px; padding: 12px; min-width: 300px; }
    h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; color: #8aa; letter-spacing: .5px; }
    button {
      background: #1d2636; color: #d6deeb; border: 1px solid #33415a;
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
    }
    button:hover { background: #26324a; }
    button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.rec { background: #b62324; border-color: #b62324; color: #fff; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    input[type=text] { background: #0b0e14; border: 1px solid #33415a; color: inherit; border-radius: 6px; padding: 6px 8px; }
    .pill { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; background: #23324a; }
    .match-big { font-size: 22px; font-weight: 700; }
    .ok { color: #3fb950; } .no { color: #8b949e; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 2px 4px; border-bottom: 1px solid #1c2432; }
    .muted { color: #6b7787; }
    .angles { font-family: ui-monospace, monospace; font-size: 12px; }
    .regs label { margin-right: 8px; white-space: nowrap; }
    .status { font-size: 12px; }
  </style>
</head>
<body>
  <div class="banner">⚠ DEBUG HARNESS — manual matching-engine testing only. Not the production app; gestures go to a throwaway store.</div>
  <div class="wrap">
    <div class="col">
      <div class="stage">
        <canvas id="cv" width="640" height="480"></canvas>
        <div id="overlay" class="overlay"><span id="ovText"></span><span id="ovSub" class="sub"></span></div>
      </div>
      <video id="vid" playsinline></video>
      <div class="panel">
        <div class="status">WS: <span id="ws" class="no">connecting…</span> · <span id="err" class="no"></span></div>
        <div class="regs" id="regs" style="margin-top:8px;"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <h2>Matcher</h2>
        <div class="row">
          <span>Kind:</span>
          <button id="kState" class="on">state (v1)</button>
          <button id="kMotion">motion (DTW v2)</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <span>Mode:</span>
          <button id="mIdle" class="on">idle</button>
          <button id="mCal">calibrate</button>
          <button id="mMatch">match</button>
        </div>
      </div>

      <div class="panel" id="calPanel">
        <h2>Calibrate — <span id="calKind">state</span></h2>
        <div class="row" id="stateCtrls">
          <button id="capRep">Capture rep</button>
        </div>
        <div class="row" id="motionCtrls" style="display:none;">
          <button id="recBtn">● Record movement</button>
          <span class="muted" id="recInfo"></span>
        </div>
        <div class="row" style="margin-top:8px;">
          reps: <span class="pill" id="repCount">0</span>
        </div>
        <div class="row" style="margin-top:8px;">
          <input id="gName" type="text" placeholder="gesture name" />
          <button id="saveBtn">Save</button>
          <button id="cancelBtn">Cancel</button>
        </div>
      </div>

      <div class="panel">
        <h2>Live match</h2>
        <div class="match-big"><span id="matchName" class="no">—</span></div>
        <div>score: <span id="matchScore" class="muted">—</span> <span id="matchFlag"></span></div>
      </div>

      <div class="panel">
        <h2>Gestures <button id="clearBtn" style="float:right;font-size:11px;">clear all</button></h2>
        <table id="gList"><tbody></tbody></table>
      </div>

      <div class="panel">
        <h2>Live angles (focused)</h2>
        <div class="angles" id="angles">—</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { FilesetResolver, PoseLandmarker, DrawingUtils }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35";

    const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm";
    const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
    const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";

    const $ = (id) => document.getElementById(id);
    const state = { kind: "state", mode: "idle", recording: false };

    // ---- WebSocket ----------------------------------------------------
    let ws;
    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => { $("ws").textContent = "connected"; $("ws").className = "ok"; };
      ws.onclose = () => { $("ws").textContent = "disconnected"; $("ws").className = "no"; setTimeout(connect, 1000); };
      ws.onmessage = (ev) => handle(JSON.parse(ev.data));
    }
    const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

    function handle(msg) {
      switch (msg.type) {
        case "hello": setKind(msg.kind, false); renderRegions(msg.regions); break;
        case "kind": setKind(msg.kind, false); break;
        case "tick":
          renderAngles(msg.angles);
          state.recording = !!msg.recording;
          $("recBtn").classList.toggle("rec", state.recording);
          $("recBtn").textContent = state.recording ? "■ Stop" : "● Record movement";
          if (state.recording) $("recInfo").textContent = msg.rec_frames + " frames";
          if (msg.match) renderMatch(msg.match); else if (state.mode === "match") renderMatch(null);
          $("err").textContent = "";
          break;
        case "calibration": setKind(msg.kind, false); $("repCount").textContent = msg.reps; break;
        case "rep_captured": $("repCount").textContent = msg.rep; break;
        case "focus_regions": break;
        case "saved": $("gName").value = ""; $("repCount").textContent = 0; setMode("idle"); break;
        case "gestures": renderGestures(msg.items); break;
        case "error": $("err").textContent = "⚠ " + msg.message; $("err").className = ""; break;
      }
    }

    // ---- UI wiring ----------------------------------------------------
    function setKind(kind, notify) {
      state.kind = kind;
      $("kState").classList.toggle("on", kind === "state");
      $("kMotion").classList.toggle("on", kind === "motion");
      $("calKind").textContent = kind;
      $("stateCtrls").style.display = kind === "state" ? "" : "none";
      $("motionCtrls").style.display = kind === "motion" ? "" : "none";
      if (notify) send({ type: "set_kind", kind });
    }
    function setMode(mode) {
      state.mode = mode;
      for (const [m, id] of [["idle","mIdle"],["calibrate","mCal"],["match","mMatch"]])
        $(id).classList.toggle("on", m === mode);
      $("calPanel").style.opacity = mode === "calibrate" ? "1" : ".5";
      if (mode === "calibrate") send({ type: "start_calibration", kind: state.kind });
      else send({ type: "set_mode", mode });
      renderMatch(null);
    }

    $("kState").onclick = () => setKind("state", true);
    $("kMotion").onclick = () => setKind("motion", true);
    $("mIdle").onclick = () => setMode("idle");
    $("mCal").onclick = () => setMode("calibrate");
    $("mMatch").onclick = () => setMode("match");
    $("capRep").onclick = () => send({ type: "capture_rep" });
    $("recBtn").onclick = () => send({ type: state.recording ? "record_stop" : "record_start" });
    $("saveBtn").onclick = () => send({ type: "save_gesture", name: $("gName").value });
    $("cancelBtn").onclick = () => { send({ type: "cancel_calibration" }); setMode("idle"); };
    $("clearBtn").onclick = () => send({ type: "clear_gestures" });

    function renderRegions(regions) {
      const el = $("regs"); el.innerHTML = "<span class='muted'>focus regions: </span>";
      for (const r of regions) {
        const lab = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = true; cb.value = r;
        cb.onchange = () => {
          const on = [...el.querySelectorAll("input:checked")].map((c) => c.value);
          send({ type: "set_focus_regions", regions: on });
        };
        lab.appendChild(cb); lab.appendChild(document.createTextNode(" " + r));
        el.appendChild(lab);
      }
    }
    function renderAngles(a) {
      const parts = Object.entries(a).map(([k, v]) => `${k}=${v === null ? "·" : v}`);
      $("angles").textContent = parts.length ? parts.join("  ") : "—";
    }
    function renderMatch(m) {
      const ov = $("overlay");
      if (state.mode !== "match") {
        ov.className = "overlay";
        $("matchName").textContent = "—"; $("matchName").className = "no";
        $("matchScore").textContent = "—"; $("matchFlag").textContent = "";
        return;
      }
      if (!m) {
        ov.className = "overlay show wait";
        $("ovText").textContent = "waiting…"; $("ovSub").textContent = "no saved gesture / hold still";
        $("matchName").textContent = "—"; $("matchName").className = "no";
        $("matchScore").textContent = "—"; $("matchFlag").textContent = "";
        return;
      }
      ov.className = "overlay show " + (m.matched ? "match" : "nomatch");
      $("ovText").textContent = m.matched ? "✓ " + m.name : "✗ NO MATCH";
      $("ovSub").textContent = (m.matched ? "score " : "closest " + m.name + " · ") + m.score;
      $("matchName").textContent = m.name;
      $("matchName").className = m.matched ? "ok" : "no";
      $("matchScore").textContent = m.score;
      $("matchFlag").textContent = m.matched ? "✓ matched" : "";
    }
    function renderGestures(items) {
      const tb = $("gList").querySelector("tbody"); tb.innerHTML = "";
      if (!items.length) { tb.innerHTML = "<tr><td class='muted'>none</td></tr>"; return; }
      for (const g of items) {
        const tr = document.createElement("tr");
        const detail = g.kind === "motion" ? `${g.trajectory_len}f` : `${Object.keys(g.target_angles).length} joints`;
        tr.innerHTML = `<td>${g.name}</td><td><span class="pill">${g.kind}</span></td><td class="muted">${detail}</td>`;
        const del = document.createElement("td");
        const b = document.createElement("button"); b.textContent = "✕"; b.style.fontSize = "11px";
        b.onclick = () => send({ type: "delete_gesture", id: g.gesture_id });
        del.appendChild(b); tr.appendChild(del); tb.appendChild(tr);
      }
    }

    // ---- Pose capture -------------------------------------------------
    async function startPose() {
      const vision = await FilesetResolver.forVisionTasks(WASM);
      const make = (delegate) => PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: MODEL, delegate },
        runningMode: "VIDEO", numPoses: 1,
      });
      let landmarker;
      try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }

      const video = $("vid"), canvas = $("cv"), ctx = canvas.getContext("2d");
      const draw = new DrawingUtils(ctx);
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream; await video.play();
      canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;

      let last = -1;
      function loop() {
        if (video.currentTime !== last) {
          last = video.currentTime;
          const res = landmarker.detectForVideo(video, performance.now());
          const world = res.worldLandmarks?.[0];
          const norm = res.landmarks?.[0];
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          if (norm) {
            draw.drawConnectors(norm, PoseLandmarker.POSE_CONNECTIONS, { color: "#22c55e", lineWidth: 3 });
            draw.drawLandmarks(norm, { color: "#ef4444", radius: 3 });
          }
          if (world && norm && world.length === 33) {
            send({
              type: "frame",
              landmarks: world.map((p) => [p.x, p.y, p.z]),
              visibility: norm.map((p) => p.visibility ?? 0),
            });
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    }

    connect();
    startPose().catch((e) => { $("err").textContent = "camera/pose error: " + e.message; });
  </script>
</body>
</html>
