name: Frontend Checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run prettier

      - name: Run typecheck
        run: npm run typecheck

      - name: Detect frontend tests
        id: frontend-tests
        run: |
          if find tests -type f ! -name '.gitkeep' ! -name 'README.md' | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run frontend test coverage
        if: steps.frontend-tests.outputs.has_tests == 'true'
        run: npm run test:coverage

      - name: Run frontend Playwright tests
        run: npm run test:e2e -- --workers=1

      - name: Upload frontend coverage artifact
        if: steps.frontend-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

      - name: Note missing frontend tests
        if: steps.frontend-tests.outputs.has_tests != 'true'
        run: echo "No frontend tests found in frontend/tests yet; skipping coverage step."
