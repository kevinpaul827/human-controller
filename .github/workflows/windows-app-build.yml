name: Windows App Build

on:
  workflow_call:

jobs:
  windows-app-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install app dependencies
        run: |
          pip install -r app/requirements.txt
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Windows app bundle
        run: python -m PyInstaller --clean --noconfirm run_app.spec

      - name: Verify app bundle exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\\HumanController\\Human Controller.exe" -PathType Leaf)) {
            throw "Packaged Windows executable was not created."
          }

      - name: Smoke-test packaged MediaPipe runtime
        shell: pwsh
        run: '& "dist\\HumanController\\Human Controller.exe" --smoke-imports'

      - name: Archive Windows app bundle
        shell: pwsh
        run: Compress-Archive -Path "dist\\HumanController" -DestinationPath "dist\\Human-Controller-Windows.zip"

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-controller-windows-release
          path: dist/Human-Controller-Windows.zip
          if-no-files-found: error
