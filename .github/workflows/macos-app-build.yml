name: macOS App Build

on:
  pull_request:
    paths:
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - "run_app.py"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/macos-app-build.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "backend/**"
      - "frontend/**"
      - "run_app.py"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/macos-app-build.yml"

jobs:
  macos-app-build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            backend/requirements.txt
            backend/matching_engine/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install app dependencies
        run: |
          pip install -r app/requirements.txt
          pip install -r backend/requirements.txt
          pip install -r backend/matching_engine/requirements.txt
          pip install pyinstaller

      - name: Build macOS app bundle
        run: make macos-app

      - name: Verify app bundle exists
        run: test -d "dist/Human Controller.app"

      - name: Smoke-test packaged MediaPipe runtime
        run: '"dist/Human Controller.app/Contents/MacOS/Human Controller" --smoke-imports'

      - name: Archive macOS app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Human Controller.app" "dist/Human Controller-macOS.zip"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-controller-macos-app
          path: dist/Human Controller-macOS.zip
          if-no-files-found: error
