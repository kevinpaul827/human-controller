name: App CI/CD

on:
  pull_request:
    paths:
      - "app/**"
      - "Makefile"
      - ".github/workflows/app-check.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Makefile"
      - ".github/workflows/app-check.yml"

jobs:
  app-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run app checks
        run: make app-check
