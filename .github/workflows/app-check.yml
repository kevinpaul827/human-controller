name: App CI/CD

on:
  pull_request:
    paths:
      - "app/**"
      - "Makefile"
      - ".github/workflows/app-check.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Makefile"
      - ".github/workflows/app-check.yml"

jobs:
  app-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libpulse0

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install coverage

      - name: Run app tests and generate coverage report
        run: make app-coverage

      - name: Upload app coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: coverage-app.xml
          if-no-files-found: error
